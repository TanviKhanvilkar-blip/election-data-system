services:
  - type: web
    name: election-data-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: election-postgres-db
          property: connectionString

databases:
  - name: election-postgres-db
    plan: free
    databaseName: election_db
    user: election_user
